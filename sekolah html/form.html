<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Daftar</legend>
            <label for="Username">Username :</label>
            <input type="text">
            <br>
            <label for="Password">Password :</label>
            <input type="Password" name="" id="">
            <br>
            <label for="Email">Email</label>
            <input type="Email :">
            <br>
            <label for="Alamat">Alamat :</label>
            <textarea name="" id="" cols="20" rows="5"></textarea>
            <br>
            <label for="">Tanggal Lahir :</label>
            <input type="Date">
            <br>
            <label for="">Jenis Kelamin :</label>
            <input type="radio" name="jk" id="">Laki-Laki
            <input type="radio" name="jk" id="">Perempuan
            <br>
            <label for="">Hobi :</label>
            <input type="checkbox" name="Hobi" value="Belajar">Belajar
            <input type="checkbox" name="Hobi" value="Olahraga">Olahraga
            <input type="checkbox" name="Hobi" value="Ngaji">Ngaji
            <input type="checkbox" name="Hobi" value="Push Rank">Push Rank
            <br>
            <label for="">Agama :</label>
            <select name="agama" id="">
                <option value="islam">Islam</option>
                <option value="kristen">Kristen</option>
                <option value="katholik">Katholik</option>
                <option value="hindu">Hindu</option>
                <option value="buddha">Buddha</option>
                <option value="konghucu">konghucu</option>
            </select>
            <br>
            <input type="submit" value="submit">
            <input type="reset" value="reset">
        </fieldset>
    </form>
</body>
</html>
