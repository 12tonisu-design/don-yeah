<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pengisian Data</title>
</head>
<body>
    <table border="1" cellspacing="0" cellpadding="10" align="center" width="600">
        <tr>
            <th colspan="2" align="center">
                <h2>Form Pengisian Data</h2>
            </th>
        </tr>
        <tr>
            <td colspan="5">
                <form action="">
                    <table border="0" cellpadding="5" width="100%">
                        <tr>
                            <td width="35%"><label for="nama">Nama Lengkap</label></td>
                            <td>: <input type="text"></td>
                        </tr>
                        <tr>
                            <td><label for="tempat_lahir">Tempat, Tgl Lahir</label></td>
                            <td>: 
                                <input type="text" id="tempat_lahir" name="tempat_lahir" placeholder="Tempat" size="12">
                                <input type="date" id="tgl_lahir" name="tgl_lahir">
                            </td>
                        </tr>
                        <tr>
                            <td align="top"><label for="alamat">Alamat</label></td>
                            <td> : <textarea id="alamat" name="alamat" cols="25" rows="4"></textarea></td>
                        </tr>
                        <tr>
                            <td><label for="">No.Hp/Telp</label></td>
                            <td>: <input type="text"></td>
                        </tr>
                        <tr>
                            <td><label>Gender</label></td>
                            <td> : 
                                <input type="radio" name="jk" value="Laki-Laki">
                                <label for="laki">Laki-Laki</label>
                                <input type="radio" name="jk" value="Perempuan">
                                <label for="perempuan">Perempuan</label>
                            </td>
                        </tr>
                        <tr>  
                            <td><label for="agama">Agama</label></td>
                            <td>: 
                                <select name="agama" id="agama">
                                    <option value="Islam">Islam</option>
                                    <option value="kristen">Kristen</option>
                                    <option value="katholik">Katholik</option>
                                    <option value="hindu">Hindu</option>
                                    <option value="buddha">Buddha</option>
                                    <option value="konghucu">Konghucu</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="">Hobi</label></td>
                            <td>: 
                                <input type="checkbox" name="Hobi" value="">Baca Buku
                                <input type="checkbox" name="Hobi" value="">Olahraga
                                <input type="checkbox" name="Hobi" value="">Main Game
                                <input type="checkbox" name="Hobi" value="">Hiking
                            </td>
                        </tr>
                        <tr align="center">
                            <td colspan="3"><input type="submit" value="submit">
                            <input type="reset" value="reset"></td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
