<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 style="text-align: center;">BIODATA</h2>
    <table border="1" cellspacing="0" cellpadding="10" align="center" width="600">
        <tr style="background-color: lightseagreen;">
            <th colspan="2" align="center">
                <h2>FORM BIODATA SISWA</h2>
            </th>
        </tr>
        <tr>
            <td colspan="6">
                <form action="">
                    <table border="0" cellpadding="10" width="100%">
                        <tr>
                            <td width="35%"><label for="nisn">NISN</label></td>
                            <td>: <input type="number" name="" id=""></td>
                        </tr>
                        <tr>
                            <td>NAMA</td>
                            <td>: <input type="text"></td>
                        </tr>
                        <tr>
                            <td>JENIS KELAMIN</td> 
                            <td>:
                                <input type="radio" name="jk" value="Laki-Laki">
                                <label for="laki">Laki-Laki</label>
                                <input type="radio" name="jk" value="Perempuan">
                                <label for="perempuan">Perempuan</label>
                            </td>
                        </tr>
                        <tr>
                            <td>AGAMA</td>
                            <td>:
                                <select name="agama" id="">
                                    <option value="islam">Islam</option>
                                    <option value="kristen">Kristen</option>
                                    <option value="katholik">Katholik</option>
                                    <option value="hindu">Hindu</option>
                                    <option value="buddha">Buddha</option>
                                    <option value="konghucu">konghucu</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="6">
                                <hr>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="6" style="text-align: center;">
                                <input style="background-color: aqua;" type="submit" value="SIMPAN DATA">
                                <input style="background-color: aqua;" type="reset" value="RESET">
                            </td>
            </tr>
        </table>
</body>
</html>
